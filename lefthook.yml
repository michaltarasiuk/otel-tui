pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: bunx oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    format:
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    images:
      glob: "*.png"
      run: |
        command -v pngquant >/dev/null && command -v oxipng >/dev/null || {
          echo "Install pngquant and oxipng to compress screenshots: brew install pngquant oxipng"
          exit 1
        }
        pngquant --quality=80-95 --skip-if-larger --force --ext .png {staged_files} || { code=$?; [ $code -eq 98 ] || [ $code -eq 99 ]; }
        oxipng -o max --strip safe -q {staged_files}
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      run: bun run typecheck

commit-msg:
  commands:
    conventional:
      run: |
        head -n 1 {1} | grep -qE '^(feat|fix|refactor|test|docs|chore): [a-z].*[^.]$' || {
          echo "Commit subject must follow AGENTS.md: '<type>: <lowercase subject>' without a scope or trailing period"
          exit 1
        }
