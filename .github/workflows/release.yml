name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, platform: darwin, arch: arm64 }
          - { runner: macos-latest, platform: darwin, arch: x64 }
          - { runner: ubuntu-latest, platform: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts --os=${{ matrix.platform }} --cpu=${{ matrix.arch }}
      - run: bun run build ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Package
        run: |
          name=otel-tui-${{ matrix.platform }}-${{ matrix.arch }}
          mkdir -p "package/$name"
          cp "dist/$name" "package/$name/otel-tui"
          cp README.md LICENSE "package/$name/"
          tar -czf "$name.tar.gz" -C package "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: otel-tui-${{ matrix.platform }}-${{ matrix.arch }}
          path: otel-tui-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum otel-tui-*.tar.gz > checksums.txt
      - run: gh release create "$GITHUB_REF_NAME" otel-tui-*.tar.gz checksums.txt --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: gh release download "$GITHUB_REF_NAME" --pattern checksums.txt --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bun scripts/homebrew-formula.ts "${GITHUB_REF_NAME#v}" checksums.txt > otel-tui.rb
      - uses: actions/checkout@v5
        with:
          repository: michaltarasiuk/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Publish the formula
        working-directory: tap
        run: |
          mkdir -p Formula
          mv ../otel-tui.rb Formula/otel-tui.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/otel-tui.rb
          git commit -m "otel-tui ${GITHUB_REF_NAME#v}"
          git push
